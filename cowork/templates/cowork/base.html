{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#173f35">
    <meta name="color-scheme" content="light">
    {% block extra_meta %}{% endblock %}
    <title>{% block title %}Plataforma Coworking{% endblock %}</title>
    <link
        href="{% static 'cowork/vendor/bootstrap/css/bootstrap.min.css' %}"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="{% static 'cowork/css/styles.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="skip-link btn btn-primary visually-hidden-focusable" href="#contenido">
        Saltar al contenido
    </a>
    {% block navbar %}{% endblock %}
    {% block content %}{% endblock %}
    <script
        src="{% static 'cowork/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"
    ></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
