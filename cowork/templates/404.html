<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Página no encontrada | Plataforma Coworking</title>
    <style>
        :root {
            --background: #f3f0e9;
            --surface: #fffdf8;
            --text: #26312c;
            --muted: #68716d;
            --primary: #2f6652;
            --border: #ddd8ce;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            color: var(--text);
            background: var(--background);
            font-family: Arial, sans-serif;
        }

        .card {
            width: min(620px, calc(100% - 32px));
            padding: clamp(28px, 7vw, 56px);
            border: 1px solid var(--border);
            border-top: 6px solid var(--primary);
            border-radius: 18px;
            background: var(--surface);
            box-shadow: 0 16px 40px rgba(38, 49, 44, 0.08);
        }

        .code {
            margin: 0;
            color: var(--primary);
            font-family: Georgia, serif;
            font-size: clamp(4.5rem, 18vw, 8rem);
            font-weight: 700;
            letter-spacing: -0.06em;
            line-height: 0.9;
        }

        h1 {
            margin: 24px 0 14px;
            font-family: Georgia, serif;
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 400;
        }

        .message {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
        }

        .path {
            display: inline-block;
            max-width: 100%;
            margin-top: 18px;
            padding: 7px 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--muted);
            font-family: monospace;
            font-size: 0.8rem;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .button {
            display: inline-block;
            margin-top: 28px;
            padding: 13px 20px;
            border-radius: 10px;
            color: white;
            background: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        .button:hover,
        .button:focus-visible {
            background: #244f3f;
        }
    </style>
</head>
<body>
    <main class="card">
        <p class="code">404</p>
        <h1>Esta página no está disponible.</h1>
        <p class="message">
            La dirección solicitada no existe o cambió de lugar. Puedes regresar al inicio
            para continuar navegando.
        </p>

        {% if request.path %}
            <span class="path" title="{{ request.path }}">{{ request.path }}</span>
        {% endif %}

        <div>
            <a class="button" href="{% url 'bienvenida' %}">Volver al inicio →</a>
        </div>
    </main>
</body>
</html>
