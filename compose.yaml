# Base MariaDB local: base de datos principal de Django.
# Reutiliza las credenciales de .env, que compose lee automáticamente:
#   podman compose up -d
services:
  mariadb:
    image: docker.io/library/mariadb:11.4
    container_name: coworking-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${NAME:?Define NAME en .env}
      MARIADB_USER: ${USER:?Define USER en .env}
      MARIADB_PASSWORD: ${PASSWORD:?Define PASSWORD en .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # Solo escucha en el equipo local.
      - "127.0.0.1:${PORT:-3306}:3306"
    volumes:
      - coworking-mariadb-datos:/var/lib/mysql
      # Scripts de la primera inicialización (permisos para la base de pruebas).
      - ./db/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Administración visual de la base en http://127.0.0.1:8081/
  # Se ingresa con USER y PASSWORD de .env.
  phpmyadmin:
    image: docker.io/library/phpmyadmin:5.2
    container_name: coworking-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      - mariadb

volumes:
  coworking-mariadb-datos:
